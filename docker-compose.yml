name: paywall

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paywall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paywall_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-paywall}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paywall} -d ${POSTGRES_DB:-paywall}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: applies pending Prisma migrations, then exits.
  # The api service waits for this to finish successfully before starting.
  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://paywall:paywall_dev_password@postgres:5432/paywall?schema=public}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      # Hardcoded, not interpolated from .env: docker-compose always builds
      # the multi-stage production image (there is no separate dev
      # Dockerfile), and that image ships without devDependencies like
      # pino-pretty. .env's NODE_ENV=development is for host-side tooling
      # (`pnpm dev`) only - letting it leak in here would make the app
      # request a logging transport that was deliberately stripped from
      # the runtime image.
      NODE_ENV: production
      # Fixed on purpose: must match the Dockerfile's EXPOSE/HEALTHCHECK port.
      # Only the host-side mapping below is user-configurable (via API_PORT).
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://paywall:paywall_dev_password@postgres:5432/paywall?schema=public}
      PLATFORM_VERSION: ${PLATFORM_VERSION:-0.1.0}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set - copy .env.example to .env and generate one}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY:?APP_SECRET_ENCRYPTION_KEY must be set - generate one with `openssl rand -base64 32`}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-100}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      # Hardcoded, not interpolated from .env: docker-compose always builds
      # the multi-stage production image (there is no separate dev
      # Dockerfile), and that image ships without devDependencies like
      # pino-pretty. .env's NODE_ENV=development is for host-side tooling
      # (`pnpm dev`) only - letting it leak in here would make the app
      # request a logging transport that was deliberately stripped from
      # the runtime image.
      NODE_ENV: production
      # Fixed on purpose: must match the Dockerfile's EXPOSE/HEALTHCHECK port.
      # Only the host-side mapping below is user-configurable (via WEB_PORT).
      PORT: 3000
      # Next's standalone server.js does `hostname = process.env.HOSTNAME || '0.0.0.0'`.
      # Docker auto-sets HOSTNAME to the container ID, which resolves (via the
      # container's own /etc/hosts entry) to its bridge-network IP - not
      # loopback - so the server would bind only to that address. The
      # HEALTHCHECK (and anything hitting `localhost` from inside the
      # container) would then always fail even though external traffic via
      # the port mapping works fine. Force it back to listening on all
      # interfaces.
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      PLATFORM_VERSION: ${PLATFORM_VERSION:-0.1.0}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:

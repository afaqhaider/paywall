name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://paywall:paywall_ci_password@localhost:5432/paywall?schema=public
  JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production-use-1234567890
  APP_SECRET_ENCRYPTION_KEY: eZpZg2tPjZMEudszgRdEtfdXZcZRJV89WaGjOTu2LhY=
  WEB_ORIGIN: http://localhost:3000

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paywall
          POSTGRES_PASSWORD: paywall_ci_password
          POSTGRES_DB: paywall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paywall -d paywall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Unit + integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f docker/api/Dockerfile -t paywall-api:ci .

      - name: Build web image
        run: docker build -f docker/web/Dockerfile -t paywall-web:ci .
